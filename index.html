<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语听写">
<title>英语听写 · 板栗</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --ink: #1c1e21; --muted: #9aa0a8;
    --line: #e5e8ee; --accent: #2f6bff; --green: #34c759; --red: #fa5151;
  }
  body.dark {
    --bg: #141518; --card: #22252b; --ink: #e9ecf0; --muted: #8a93a0;
    --line: #34383f; --accent: #5b83fa; --green: #4cd964; --red: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 17px; line-height: 1.5; min-height: 100vh; min-height: 100dvh; background-attachment: fixed; }
  .app { max-width: 640px; margin: 0 auto; padding: 14px 16px 48px; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 14px; }
  .title { font-size: 22px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 17px; cursor: pointer; }

  .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }

  .unit-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .unit-chip { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
  .unit-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .opt-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .opt-row label { font-size: 15px; }
  .opt-row select, .opt-row input { font-size: 15px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }

  .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 18px;
    font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-muted { background: var(--line); color: var(--ink); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  .dict-num { font-size: 60px; font-weight: 800; text-align: center; margin: 20px 0 6px; }
  .dict-num .small { font-size: 22px; color: var(--muted); font-weight: 600; }
  .dict-hint { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .speak-btn { display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 3px solid var(--accent); background: var(--card);
    color: var(--accent); cursor: pointer; margin: 14px auto; }
  .speak-lg { width: 96px; height: 96px; }
  .speak-sm { width: 72px; height: 72px; border-width: 2px; }
  .playing-note { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }

  .gap-ctrl { display: flex; align-items: center; gap: 8px; }
  .gap-ctrl input[type=range] { flex: 1; min-width: 90px; height: 22px; accent-color: var(--accent); }
  .unit-s { font-size: 13px; color: var(--muted); }
  .range-hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .check-no { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .check-book { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .dict-book { text-align: center; font-size: 13px; color: var(--muted); margin-top: -12px; margin-bottom: 8px; }
  .check-word { text-align: center; margin: 18px 0; }
  .check-en { font-size: 40px; font-weight: 800; letter-spacing: 0.5px; }
  .check-cn { color: var(--muted); font-size: 18px; margin-top: 8px; }
  .check-unit { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .score-big { font-size: 44px; font-weight: 800; text-align: center; margin: 8px 0; }
  .score-label { text-align: center; color: var(--muted); font-size: 14px; }
  .result-item { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .result-item:last-child { border-bottom: none; }
  .result-item .en { font-weight: 700; }
  .result-item .cn { color: var(--muted); font-size: 14px; }
  .correct { color: var(--green); font-weight: 700; }
  .wrong { color: var(--red); font-weight: 700; }

  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(20,22,26,0.92); color: #fff; padding: 10px 22px; border-radius: 8px;
    font-size: 14px; z-index: 999; max-width: 90vw; }
  .word-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .stat { text-align: center; padding: 8px 14px; background: var(--card); border-radius: 10px; border: 1px solid var(--line); }
  .stat .num { font-size: 22px; font-weight: 800; }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .hidden { display: none !important; }
  .progress-bar { height: 5px; background: var(--line); border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <div class="title">英语听写</div>
      <div class="sub">广州三上英语 · 报读 + 手写核对</div>
    </div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </div>

  <!-- 首页 -->
  <div id="screen-home">
    <div class="card">
      <h2>① 选择范围（按课本顺序）</h2>
      <div class="unit-grid" id="unitGrid"></div>
    </div>
    <div class="card">
      <h2>② 听写设置</h2>
      <div class="opt-row">
        <label>内容</label>
        <select id="modeSel">
          <option value="word">单词</option>
          <option value="phrase">短语/句子</option>
        </select>
      </div>
      <div class="opt-row">
        <label>每词读几遍</label>
        <select id="repeatSel">
          <option value="1">1 遍</option>
          <option value="2" selected>2 遍</option>
          <option value="3">3 遍</option>
        </select>
      </div>
      <div class="opt-row">
        <label>词间隔（秒）</label>
        <div class="gap-ctrl">
          <input type="range" id="gapRange" min="1" max="60" step="0.5" value="12">
          <input type="number" id="gapNum" min="1" max="300" step="0.5" value="12" style="width:74px">
          <span class="unit-s">秒</span>
        </div>
      </div>
      <div class="opt-row">
        <label>听写第几个 到 第几个</label>
        <div>
          <input type="number" id="startNum" min="1" value="1" style="width:64px">
          <span> 到 </span>
          <input type="number" id="endNum" min="1" value="10" style="width:64px">
          <span id="rangeHint" class="range-hint"></span>
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn">开始报读</button>
    </div>
    <div class="card">
      <h2>📊 词汇统计</h2>
      <div class="word-stats">
        <div class="stat"><div class="num" id="statWords">0</div><div class="lbl">总词数</div></div>
        <div class="stat"><div class="num" id="statRight">0</div><div class="lbl">累计对</div></div>
        <div class="stat"><div class="num" id="statWrong">0</div><div class="lbl">累计错</div></div>
      </div>
    </div>
  </div>

  <!-- 报读屏 -->
  <div id="screen-dict" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="dictFill" style="width:0%"></div></div>
    <div class="dict-num"><span id="dictIdx">1</span><span class="small"> / <span id="dictTotal">10</span></span></div>
    <div class="dict-hint">听音频 · 在本子上写 · 不要偷看课本哦</div>
    <div class="dict-book" id="dictBook"></div>
    <button class="speak-btn speak-lg" id="speakBtn"><span class="icon" style="font-size:40px">🔊</span></button>
    <div class="playing-note" id="playingNote">报读中… 点喇叭重听这一题</div>
    <div class="btn-row">
      <button class="btn btn-muted" id="prevBtn">◀ 上一题</button>
      <button class="btn btn-muted" id="pauseBtn">暂停</button>
      <button class="btn btn-primary" id="nextBtn">下一题 ▶</button>
    </div>
    <button class="btn btn-green" id="goCheckBtn" style="margin-top:10px">写完了，开始核对 ✔</button>
    <button class="btn btn-muted" id="quitBtn" style="margin-top:8px">退出本次听写</button>
  </div>

  <!-- 核对屏 -->
  <div id="screen-check" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="checkFill" style="width:0%"></div></div>
    <div class="dict-hint">问孩子写的什么 · 点对或错</div>
    <div class="card">
      <div class="check-word">
        <div class="check-unit" id="checkUnit"></div>
        <div class="check-no" id="checkNo"></div>
        <div class="check-book" id="checkBook"></div>
        <div class="check-en" id="checkEn">—</div>
        <div class="check-cn" id="checkCn"></div>
      </div>
      <button class="speak-btn speak-sm" id="checkSpeak"><span class="icon" style="font-size:28px">🔊</span></button>
    </div>
    <div class="btn-row">
      <button class="btn btn-red" id="markWrong">✗ 错</button>
      <button class="btn btn-green" id="markRight">✓ 对</button>
    </div>
    <button class="btn btn-muted" id="checkBackBtn" style="margin-top:8px">返回报读</button>
  </div>

  <!-- 结果屏 -->
  <div id="screen-result" class="hidden">
    <div class="card">
      <div class="score-label">本次听写成绩</div>
      <div class="score-big" id="resultScore">0 / 10</div>
      <div class="score-label" id="resultMsg"></div>
    </div>
    <div class="card">
      <h2>📝 详情</h2>
      <div id="resultList"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="againBtn">错词再练一轮</button>
    </div>
    <button class="btn btn-muted" id="homeBtn" style="margin-top:8px">返回首页</button>
  </div>

</div>

<script>
// ============ 词库 ============
const WORDBANK = {"source":"新版人教版三年级上册英语 Word List (PDF 色块归属 + 印刷顺序)","words":{"Unit 1":[{"no":1,"en":"me","cn":"我"},{"no":2,"en":"it","cn":"它"},{"no":3,"en":"be(am/is/are)","cn":"是"},{"no":4,"en":"on","cn":"在……上面"},{"no":5,"en":"this","cn":"这，这个"},{"no":6,"en":"ruler","cn":"尺子"},{"no":7,"en":"you","cn":"你，你们"},{"no":8,"en":"I","cn":"我"},{"no":9,"en":"thank","cn":"感谢，向……表示感谢"},{"no":10,"en":"nice","cn":"令人愉快的"},{"no":11,"en":"to","cn":"到，向，往"},{"no":12,"en":"meet","cn":"结识；遇见"},{"no":13,"en":"too","cn":"也"},{"no":14,"en":"hi","cn":"嗨，喂，你好"},{"no":15,"en":"but","cn":"但，但是"}],"Unit 2":[{"no":1,"en":"chocolate","cn":"巧克力"},{"no":2,"en":"coffee","cn":"咖啡"},{"no":3,"en":"Chinese","cn":"中文"},{"no":4,"en":"sofa","cn":"沙发"},{"no":5,"en":"hamburger","cn":"汉堡"},{"no":6,"en":"cookie","cn":"饼干"},{"no":7,"en":"salad","cn":"沙拉"},{"no":8,"en":"what","cn":"什么"},{"no":9,"en":"in","cn":"在……里面"},{"no":10,"en":"English","cn":"英语"},{"no":11,"en":"know","cn":"知道；认识"},{"no":12,"en":"yes","cn":"是，对"},{"no":13,"en":"can","cn":"能，可以"},{"no":14,"en":"get","cn":"得到"},{"no":15,"en":"a(an)","cn":"一，一个"},{"no":16,"en":"word","cn":"单词"},{"no":17,"en":"guess","cn":"猜，猜测"},{"no":18,"en":"one","cn":"一"},{"no":19,"en":"like","cn":"喜欢"}],"Unit 3":[{"no":1,"en":"good","cn":"好的"},{"no":2,"en":"morning","cn":"早晨；上午"},{"no":3,"en":"your","cn":"你的；你们的"},{"no":4,"en":"name","cn":"名字"},{"no":5,"en":"my","cn":"我的"},{"no":6,"en":"Mr","cn":"先生"},{"no":7,"en":"boy","cn":"男孩"},{"no":8,"en":"and","cn":"和"},{"no":9,"en":"girl","cn":"女孩"},{"no":10,"en":"hello","cn":"你好"},{"no":11,"en":"everyone","cn":"每个人，人人"},{"no":12,"en":"card","cn":"卡片"},{"no":13,"en":"student","cn":"学生"},{"no":14,"en":"want","cn":"想要"},{"no":15,"en":"help","cn":"帮助，帮忙"},{"no":16,"en":"how","cn":"多少；怎样，如何"},{"no":17,"en":"last","cn":"最后"},{"no":18,"en":"of","cn":"……的"},{"no":19,"en":"for","cn":"为了"},{"no":20,"en":"Ms","cn":"女士"},{"no":21,"en":"Miss","cn":"小姐"},{"no":22,"en":"Mrs","cn":"女士，夫人"}],"Unit 4":[{"no":1,"en":"red","cn":"红色"},{"no":2,"en":"yellow","cn":"黄色"},{"no":3,"en":"green","cn":"绿色"},{"no":4,"en":"blue","cn":"蓝色"},{"no":5,"en":"white","cn":"白色"},{"no":6,"en":"colour","cn":"颜色"},{"no":7,"en":"pencil","cn":"铅笔"},{"no":8,"en":"left","cn":"左边"},{"no":9,"en":"hand","cn":"手"},{"no":10,"en":"right","cn":"右边"},{"no":11,"en":"finger","cn":"手指"},{"no":12,"en":"do","cn":"做"},{"no":13,"en":"spell","cn":"拼写"},{"no":14,"en":"that","cn":"那，那个"},{"no":15,"en":"look","cn":"看，瞧，望"},{"no":16,"en":"cool","cn":"酷的，帅的"},{"no":17,"en":"teach","cn":"教"},{"no":18,"en":"first","cn":"第一的；首先；最初"},{"no":19,"en":"OK","cn":"好，可以"}],"Unit 5":[{"no":1,"en":"two","cn":"二"},{"no":2,"en":"three","cn":"三"},{"no":3,"en":"four","cn":"四"},{"no":4,"en":"five","cn":"五"},{"no":5,"en":"six","cn":"六"},{"no":6,"en":"seven","cn":"七"},{"no":7,"en":"nine","cn":"九"},{"no":8,"en":"the","cn":"这，那"},{"no":9,"en":"again","cn":"再，再次"},{"no":10,"en":"step","cn":"步骤"},{"no":11,"en":"letter","cn":"字母"},{"no":12,"en":"from","cn":"从"},{"no":13,"en":"each","cn":"每个"},{"no":14,"en":"put","cn":"放"},{"no":15,"en":"them","cn":"它们"}],"Unit 6":[{"no":1,"en":"face","cn":"脸，面部"},{"no":2,"en":"ear","cn":"耳朵"},{"no":3,"en":"eye","cn":"眼睛"},{"no":4,"en":"nose","cn":"鼻子"},{"no":5,"en":"mouth","cn":"嘴巴"},{"no":6,"en":"its","cn":"它的"},{"no":7,"en":"these","cn":"这些"},{"no":8,"en":"hair","cn":"头发"},{"no":9,"en":"write","cn":"写"},{"no":10,"en":"big","cn":"大的"},{"no":11,"en":"under","cn":"在……下面"},{"no":12,"en":"his","cn":"他的"},{"no":13,"en":"now","cn":"现在"},{"no":14,"en":"head","cn":"头"}],"Unit 7":[{"no":1,"en":"see","cn":"看见；明白"},{"no":2,"en":"nod","cn":"点头"},{"no":3,"en":"keep","cn":"保持"},{"no":4,"en":"quiet","cn":"安静"},{"no":5,"en":"listen","cn":"听"},{"no":6,"en":"teacher","cn":"老师"},{"no":7,"en":"have","cn":"有，拥有"},{"no":8,"en":"up","cn":"向上"},{"no":9,"en":"they","cn":"他们"},{"no":10,"en":"body","cn":"身体"},{"no":11,"en":"friend","cn":"朋友"},{"no":12,"en":"myself","cn":"我自己"},{"no":13,"en":"heart","cn":"心，心脏；内心"}],"Unit 8":[{"no":1,"en":"bird","cn":"鸟"},{"no":2,"en":"horse","cn":"马"},{"no":3,"en":"monkey","cn":"猴子"},{"no":4,"en":"fish","cn":"鱼"},{"no":5,"en":"bear","cn":"熊"},{"no":6,"en":"swim","cn":"游泳"},{"no":7,"en":"walk","cn":"走，走路"},{"no":8,"en":"fly","cn":"飞，飞翔"},{"no":9,"en":"jump","cn":"跳，跳跃"},{"no":10,"en":"arm","cn":"手臂"},{"no":11,"en":"leg","cn":"腿"},{"no":12,"en":"tiger","cn":"老虎"},{"no":13,"en":"then","cn":"然后，接下来"},{"no":14,"en":"let","cn":"让"},{"no":15,"en":"us","cn":"我们"},{"no":16,"en":"move","cn":"移动"},{"no":17,"en":"our","cn":"我们的"},{"no":18,"en":"foot","cn":"脚"}]},"review":[{"no":1,"en":"their","cn":"他们的"},{"no":2,"en":"mum","cn":"妈妈"},{"no":3,"en":"dad","cn":"爸爸"},{"no":4,"en":"family","cn":"家庭"},{"no":5,"en":"where","cn":"哪里"},{"no":6,"en":"when","cn":"什么时候"},{"no":7,"en":"class","cn":"班级"},{"no":8,"en":"not","cn":"不"},{"no":9,"en":"she","cn":"她"}],"reviewPhrases":[{"no":1,"en":"a music show","cn":"一场音乐表演"},{"no":2,"en":"This is my...","cn":"这是我的……"},{"no":3,"en":"It's good to see you!","cn":"很高兴见到你！"},{"no":4,"en":"You are here.","cn":"你坐这里。"},{"no":5,"en":"Thanks! / Thank you!","cn":"谢谢！"},{"no":6,"en":"You're welcome.","cn":"不用谢。"}]};

// ============ 状态 ============
const THEME_KEY = "dict_theme";
const STATS_KEY = "dict_stats";
let selectedUnits = new Set();
let list = [];
let idx = 0;
let checkIdx = 0;
let marks = [];
let playing = false;
let playTimers = [];
let rangeStart = 1;

function $(id){ return document.getElementById(id); }

function sortedUnits() {
  return Object.keys(WORDBANK.words).sort((a,b) => {
    const na = parseInt((a.match(/\d+/)||[99])[0]);
    const nb = parseInt((b.match(/\d+/)||[99])[0]);
    return na - nb;
  });
}

// ============ 语音: 优选高质量英文音色 ============
let EN_VOICE = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : [];
  if (!vs.length) return;
  const priority = [/siri/i, /samantha/i, /karen/i, /daniel/i, /aria/i, /jenny/i, /libby/i, /sonia/i];
  for (const p of priority) {
    const v = vs.find(x => p.test(x.name));
    if (v) { EN_VOICE = v; return; }
  }
  EN_VOICE = vs.find(v => v.lang === "en-US" && v.localService) || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

// 把 "be(am/is/are)" / "a(an)" 拆成 ["be","am","is","are"] / ["a","an"]
// 拆分单词形态: "be(am/is/are)" -> [be,am,is,are]   "a(an)" -> [a,an]
// 只用于展示 (核对屏告诉家长要写哪几个)
function wordForms(en) {
  const s = String(en).trim();
  const paren = s.match(/^([A-Za-z]+)\s*\(([^()]*)\)$/);
  if (paren) {
    const head = paren[1].trim();
    const alts = paren[2].split(/[\/,、]/).map(x => x.trim()).filter(Boolean);
    return [head].concat(alts.filter(a => a.toLowerCase() !== head.toLowerCase()));
  }
  if (s.includes("/")) return s.split("/").map(x => x.trim()).filter(Boolean);
  return [s];
}
// 实际朗读序列。孤立单字母 a/e/i/o/u 会被 TTS 当成英文字母名
// (a 念成 /eɪ/ 而非冠词 /ə/), 必须带词组上下文才读对。
// 多形态词的两种视图:
//   wordForms(word)  -> 要写哪几个 (核对屏显示, 仍是 [a, an])
//   speakSeq(word)   -> 实际朗读顺序 (命中预生成音频的, 返回 [{type:"audio", file:"audio/a.mp3"}])
// 孤立 a 单 TTS 必读 /eɪ/, 预生成 a.mp3 / an.mp3 用 HTML5 Audio 精确播放
const AUDIO_MAP = {
  "a":   "audio/a.mp3",
  "an":  "audio/an.mp3",
  "be":  null, "am": null, "is": null, "are": null,
};
function speakSeq(en) {
  return wordForms(en).map(f => {
    const k = f.toLowerCase();
    return AUDIO_MAP[k] !== undefined
      ? { type: AUDIO_MAP[k] ? "audio" : "tts", file: AUDIO_MAP[k], text: f }
      : { type: "tts", text: f };
  });
}
let audioEl = null;
function playAudioItem(item, onend) {
  audioEl = new Audio(item.file);
  audioEl.onended = () => { if(onend) onend(); };
  audioEl.onerror = () => { console.warn("音频加载失败", item.file); if(onend) onend(); };
  audioEl.play().catch(e => { console.warn("音频播放失败", e); if(onend) onend(); });
}
function speakOnce(text, onend) {
  if (window.speechSynthesis) speechSynthesis.cancel();
  const seq = speakSeq(text);
  let i = 0;
  const next = () => {
    if (i >= seq.length) { if(onend) onend(); return; }
    const it = seq[i++];
    if (it.type === "audio" && it.file) {
      playAudioItem(it, () => setTimeout(next, 1500));
    } else {
      const u = new SpeechSynthesisUtterance(it.text);
      if (EN_VOICE) u.voice = EN_VOICE;
      u.lang = (EN_VOICE && EN_VOICE.lang) || "en-US";
      u.rate = 0.8; u.pitch = 1.0;
      u.onend = () => setTimeout(next, 420);
      u.onerror = () => setTimeout(next, 420);
      speechSynthesis.speak(u);
    }
  };
  next();
}

// ============ 主题 ============
function applyTheme() {
  const dark = localStorage.getItem(THEME_KEY) === "dark";
  document.body.classList.toggle("dark", dark);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
}

// ============ 首页 ============
function renderUnits() {
  const g = $("unitGrid"); g.innerHTML = "";
  const allUnits = sortedUnits().slice();
  if (WORDBANK.review && WORDBANK.review.length) allUnits.push("Review");
  for (const u of allUnits) {
    const n = (u === "Review") ? WORDBANK.review.length : (WORDBANK.words[u]||[]).length;
    const chip = document.createElement("button");
    chip.className = "unit-chip" + (selectedUnits.has(u) ? " active" : "");
    chip.textContent = u.replace("Unit ","U") + " · " + n + "词";
    chip.onclick = () => {
      if (selectedUnits.has(u)) selectedUnits.delete(u); else selectedUnits.add(u);
      renderUnits();
    };
    g.appendChild(chip);
  }
}

function poolWords() {
  let pool = [];
  for (const u of sortedUnits()) {
    if (selectedUnits.size === 0 || selectedUnits.has(u)) {
      const list = WORDBANK.words[u];
      if (!list) continue;
      for (const w of list) pool.push({en:w.en, cn:w.cn, no:w.no, unit:u});
    }
  }
  if (WORDBANK.review && WORDBANK.review.length &&
      (selectedUnits.size === 0 || selectedUnits.has("Review"))) {
    for (const w of WORDBANK.review) pool.push({en:w.en, cn:w.cn, no:w.no, unit:"Review"});
  }
  return pool;
}
function poolPhrases() {
  const list = WORDBANK.reviewPhrases || WORDBANK.phrases || [];
  return list.map(p => ({en:p.en, cn:p.cn, no:p.no, unit:"短语"}));
}

function updateStats() {
  const s = JSON.parse(localStorage.getItem(STATS_KEY) || "{}");
  let right = 0, wrong = 0;
  for (const k in s) { right += s[k].right||0; wrong += s[k].wrong||0; }
  const pool = $("modeSel").value === "phrase" ? poolPhrases() : poolWords();
  $("statWords").textContent = pool.length;
  $("statRight").textContent = right;
  $("statWrong").textContent = wrong;
}

// ============ 报读 ============
function stopPlay() {
  playing = false;
  playTimers.forEach(clearTimeout);
  playTimers = [];
  if (window.speechSynthesis) speechSynthesis.cancel();
}

function buildList() {
  const mode = $("modeSel").value;
  let pool = mode === "phrase" ? poolPhrases() : poolWords();
  if (mode === "phrase") {
    let from = Math.max(1, parseInt($("startNum").value) || 1);
    let to   = Math.max(1, parseInt($("endNum").value)   || 10);
    if (from > to) { const t = from; from = to; to = t; }
    if (from > pool.length) { alert("起始序号超出范围（共 " + pool.length + " 条）"); return false; }
    to = Math.min(to, pool.length);
    list = pool.slice(from-1, to);
    rangeStart = from;
  } else {
    if (pool.length === 0) { alert("请先选择单元"); return false; }
    // 区间语义: startNum 到 endNum (闭区间), 超范围自动收敛
    let from = Math.max(1, parseInt($("startNum").value) || 1);
    let to   = Math.max(1, parseInt($("endNum").value)   || 10);
    if (from > to) { const t = from; from = to; to = t; }   // 填反了自动交换
    if (from > pool.length) { alert("起始序号超出范围（共 " + pool.length + " 词）"); return false; }
    to = Math.min(to, pool.length);
    from = Math.min(from, to);
    list = pool.slice(from-1, to);
    rangeStart = from;
  }
  if (list.length === 0) { alert("没有可选内容"); return false; }
  return true;
}

function playCurrentWord() {
  const w = list[idx];
  if (!w) return;
  const repeat = parseInt($("repeatSel").value)||2;
  const gap = getGap();
  stopPlay();
  playing = true;
  $("dictIdx").textContent = idx + 1;
  $("dictBook").textContent = w.no != null ? ("课本第 " + w.no + " 个") : "";
  $("dictTotal").textContent = list.length;
  $("dictFill").style.width = (idx / list.length * 100) + "%";
  let t = 0;
  const playChain = (i) => {
    if (!playing) return;
    if (i >= repeat) {
      playTimers.push(setTimeout(() => {
        if (!playing) return;
        if (idx < list.length - 1) { idx++; playCurrentWord(); }
        else { stopPlay(); toast("全部报读完毕！核对吧 ✔"); }
      }, gap));
      return;
    }
    speakOnce(w.en, () => {
      if (!playing) return;
      playTimers.push(setTimeout(() => playChain(i+1), 1600));
    });
  };
  playChain(0);
}

function gotoWord(i) {
  if (i < 0) i = 0;
  if (i > list.length-1) i = list.length-1;
  idx = i;
  playCurrentWord();
}


function updateRangeHint() {
  const pool = $("modeSel").value === "phrase" ? poolPhrases() : poolWords();
  if (!pool.length) { $("rangeHint").textContent = ""; return; }
  let f = parseInt($("startNum").value) || 1;
  let t = parseInt($("endNum").value) || 10;
  if (f > t) { const x = f; f = t; t = x; }
  const c = Math.max(0, Math.min(t, pool.length) - f + 1);
  $("rangeHint").textContent = "（共 " + c + " 词，当前池 " + pool.length + "）";
}


// ============ 词间隔 (完全可调 1~300 秒) ============
function getGap() {
  let v = parseFloat($("gapNum").value);
  if (!isFinite(v) || v < 1) v = 1;
  if (v > 300) v = 300;
  return v * 1000;   // 毫秒
}
function syncGap(fromRange) {
  const r = $("gapRange"), n = $("gapNum");
  let v = parseFloat(fromRange === "n" ? n.value : r.value);
  if (!isFinite(v)) v = 12;
  v = Math.min(300, Math.max(1, v));
  n.value = v;
  r.value = Math.min(60, v);   // 滑块上限 60, 超过则滑块钉在 60
  localStorage.setItem("dict_gap", v);
}
function initGap() {
  const saved = parseFloat(localStorage.getItem("dict_gap"));
  const v = (isFinite(saved) && saved >= 1) ? saved : 12;
  $("gapNum").value = v;
  $("gapRange").value = Math.min(60, v);
}

// ============ 核对 ============
function startCheck() {
  stopPlay();
  checkIdx = 0;
  marks = [];
  showScreen("screen-check");
  renderCheck();
}

function renderCheck() {
  const w = list[checkIdx];
  if (!w) return;
  $("checkUnit").textContent = w.unit;
  $("checkNo").textContent = "第 " + (checkIdx + 1) + " / " + list.length + " 个"
    + (list.length < 100 ? "（本区间第 " + (checkIdx+1) + " 个）" : "");
  $("checkEn").textContent = w.en;
  $("checkCn").textContent = w.cn;
  $("checkFill").style.width = ((checkIdx + 1) / list.length * 100) + "%";
  // 若该词在课本里有原始序号 (no), 一并显示, 方便跟单词表对照
  const forms = wordForms(w.en);
  let tip = (w.no != null) ? ("课本第 " + w.no + " 个") : "";
  if (forms.length > 1) {
    tip += (tip ? " · " : "") + "要写 " + forms.length + " 个: " + forms.join(" / ");
  }
  $("checkBook").textContent = tip;
  $("checkBook").style.display = tip ? "" : "none";
}

function mark(right) {
  const w = list[checkIdx];
  if (!w) return;
  marks.push({en:w.en, cn:w.cn, no:w.no, unit:w.unit, right});
  // 统计写入必须容错: 配额满/隐私模式抛错会中断后续 checkIdx++, 导致核对卡在第一个词
  try {
    const s = JSON.parse(localStorage.getItem(STATS_KEY) || "{}");
    if (!s[w.en]) s[w.en] = {right:0, wrong:0};
    if (right) s[w.en].right++; else s[w.en].wrong++;
    localStorage.setItem(STATS_KEY, JSON.stringify(s));
  } catch(e) {
    console.warn("统计保存失败(不影响核对):", e);
  }
  checkIdx++;
  if (checkIdx >= list.length) showResult();
  else renderCheck();
}

function showResult() {
  const right = marks.filter(m => m.right).length;
  showScreen("screen-result");
  $("resultScore").textContent = right + " / " + marks.length;
  const pct = Math.round(right / marks.length * 100);
  $("resultMsg").textContent = pct >= 90 ? "太棒了！🎉" : pct >= 70 ? "不错，继续加油！" : "错词再练一轮吧！";
  const l = $("resultList"); l.innerHTML = "";
  for (const m of marks) {
    const row = document.createElement("div");
    row.className = "result-item";
    row.innerHTML = '<span><span class="' + (m.right?'correct':'wrong') + '">' + (m.right?'✓':'✗') + '</span> <span class="en">' + m.en + '</span> <span class="cn">' + m.cn + '</span></span>'
      + '<span class="cn">' + m.unit + '</span>';
    l.appendChild(row);
  }
  updateStats();
}

// ============ 工具 ============
function showScreen(id) {
  ["screen-home","screen-dict","screen-check","screen-result"].forEach(s => {
    $(s).classList.toggle("hidden", s !== id);
  });
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============ 初始化 ============
window.addEventListener("load", () => {
  applyTheme();
  renderUnits();
  updateStats();
  updateRangeHint();
  initGap();

  $("themeBtn").onclick = () => {
    localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==="dark" ? "" : "dark");
    applyTheme();
  };
  $("modeSel").onchange = () => { updateStats(); updateRangeHint(); };
  $("startNum").oninput = updateRangeHint;
  $("gapRange").oninput = () => syncGap("r");
  $("gapNum").oninput   = () => syncGap("n");
  $("endNum").oninput = updateRangeHint;

  $("startBtn").onclick = () => {
    if (!buildList()) return;
    idx = 0;
    showScreen("screen-dict");
    setTimeout(() => playCurrentWord(), 300);
  };

  $("speakBtn").onclick = () => { const w = list[idx]; if (w) speakOnce(w.en); };
  $("prevBtn").onclick = () => gotoWord(idx-1);
  $("nextBtn").onclick = () => {
    if (idx < list.length-1) gotoWord(idx+1);
    else { stopPlay(); toast("已经是最后一题，核对吧 ✔"); }
  };
  $("pauseBtn").onclick = function() {
    if (playing) { stopPlay(); this.textContent = "继续"; $("playingNote").textContent = "已暂停"; }
    else { this.textContent = "暂停"; $("playingNote").textContent = "报读中… 点喇叭重听这一题"; playCurrentWord(); }
  };
  $("goCheckBtn").onclick = startCheck;
  $("quitBtn").onclick = () => { stopPlay(); showScreen("screen-home"); };

  $("markRight").onclick = () => mark(true);
  $("markWrong").onclick = () => mark(false);
  $("checkSpeak").onclick = () => { const w = list[checkIdx]; if (w) speakOnce(w.en); };
  $("checkBackBtn").onclick = () => { showScreen("screen-dict"); };

  $("againBtn").onclick = () => {
    const wrong = marks.filter(m => !m.right);
    if (wrong.length === 0) { showScreen("screen-home"); return; }
    list = wrong.map(w => ({en:w.en, cn:w.cn, no:w.no, unit:w.unit}));
    idx = 0;
    showScreen("screen-dict");
    setTimeout(() => playCurrentWord(), 300);
  };
  $("homeBtn").onclick = () => showScreen("screen-home");
});
</script>
